# Edge proxy for the central platform. TLS is expected to terminate here or at a managed
# load balancer in front; certificate configuration is deployment specific.
worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  server_tokens off;
  client_max_body_size 6m;
  keepalive_timeout 65;

  log_format json escape=json '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method","uri":"$request_uri",'
                              '"status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"urt":"$upstream_response_time","rid":"$request_id"}';
  access_log /var/log/nginx/access.log json;

  # Coarse per-IP limits at the edge; finer per-route limits are enforced in the API (Redis-backed).
  limit_req_zone $binary_remote_addr zone=api:20m rate=50r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;
  limit_req_status 429;

  # Docker's DNS is re-resolved, so every scaled API replica receives traffic.
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream api_upstream   { zone api 64k; server api:4000 resolve; keepalive 64; }
  upstream admin_upstream { zone admin 64k; server admin:3000 resolve; keepalive 16; }

  map $http_x_request_id $rid { default $http_x_request_id; "" $request_id; }

  # api.<your-domain>: storefront servers, gateway webhooks, scanner and admin API
  server {
    listen 8080;
    server_name api.localhost api.*;

    location /v1/admin/auth/login { limit_req zone=auth burst=10 nodelay; proxy_pass http://api_upstream; include /etc/nginx/proxy.inc; }
    location /metrics { deny all; }  # scrape metrics on the internal network only
    location /docs { allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; allow 127.0.0.1; deny all; proxy_pass http://api_upstream; include /etc/nginx/proxy.inc; }
    location / { limit_req zone=api burst=200 nodelay; proxy_pass http://api_upstream; include /etc/nginx/proxy.inc; }
  }

  # admin.<your-domain>: administration portal (it proxies /api to the API itself)
  server {
    listen 8080 default_server;
    server_name admin.localhost admin.*;
    location / { proxy_pass http://admin_upstream; include /etc/nginx/proxy.inc; }
  }
}
